<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="bulbstyle.css">
</head>
<body>
    <img id="myImage" onclick="changeImage()" 
         src="bulboff.gif" width="100" height="180">
    <button onclick="btnshow()" class="dropbtn">Show</button>
    
    <div class="container">
        <input id="searchbar" 
               onkeyup="search_num()" 
               type="text" name="search" 
               placeholder="Search number">
    </div>

    <script>
        function changeImage() {
            var image = document.getElementById('myImage');
            if (image.src.match("bulbon")) {
                image.src = "bulboff.gif";
            } else {
                image.src = "bulbon.jpg";
            }
        }

        function btnshow() {
            let inputValue = document.getElementById('searchbar').value;
            
           
            for (let i = 1; i <= 3; i++) {
                var x = document.createElement("INPUT");
                x.setAttribute("type", "number");
                x.setAttribute("value", i);
                document.body.appendChild(x);
            }
        }

        function search_num() {
            let input = document.getElementById('searchbar').value;
            alert('Searching for: ' + input);  
        }
    </script>
    
</body>
</html>
